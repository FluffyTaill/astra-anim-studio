<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="http://astra-plugin.localhost/bridge/astra-bridge.js"></script>
<title>Anim Studio</title>
<style>
/* Colours come from Astra's own theme: the bridge loads theme/variables.css and sets data-theme
   (light / dark) and the user's accent on <html>, and sends them again on every switch, so the
   page follows Astra by itself. The values after the commas are only for a page opened outside
   Astra. The page is drawn over Astra (`transparent` contribution): no background of its own, and
   no `color-scheme` on the root — that would make WebView paint the frame dark underneath. */
:root{font-family:Inter,"Segoe UI",sans-serif;
  --text:var(--color-text,#e9ecf3);--muted:var(--color-text-muted,#8a93a8);
  --card:var(--color-surface,#171b24);--raised:var(--color-surface-raised,#1d2230);--hover:var(--color-surface-hover,#20263a);
  --line:var(--color-border-subtle,#ffffff14);--line2:var(--color-border,#ffffff22);
  --accent:var(--color-accent,#8b7cff);--accent-soft:var(--color-accent-soft,#8b7cff26);--accent-text:var(--color-accent-text,#b9afff);
  --on-accent:var(--color-text-on-accent,#fff);--accent2:var(--hue-strawberry,#ff7ab6);
  --ok:var(--color-success,#2f9e6f);--ok-bg:var(--color-success-bg,#2f9e6f1a);--ok-border:var(--color-success-border,#2f9e6f55);
  --warn-bg:var(--color-warning-bg,#d8b45a14);--warn-border:var(--color-warning-border,#d8b45a40);
  --bad:var(--color-danger,#e06a7e);--bad-bg:var(--color-danger-bg,#e06a7e14);--bad-border:var(--color-danger-border,#e06a7e55);
  --field:var(--color-paper,#0b0e15);--toggle-off:var(--color-toggle-off,#ffffff1a);--knob:var(--color-knob,#cfd3de);
  --backdrop:var(--color-backdrop,#000a)}
body{color-scheme:light dark}
:root[data-theme="light"] body{color-scheme:light}
:root[data-theme="dark"] body{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--text);font-size:14px}
.wrap{max-width:1040px;margin:0 auto;padding:26px 24px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.3px}
h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin-top:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:10px;padding:9px 14px;background:var(--raised);color:var(--text);cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.primary:hover{background:var(--color-accent-hover,var(--accent))}
.btn.apply{background:var(--ok);border-color:transparent;color:#fff}
.btn.apply.dirty{animation:pulse 1.4s infinite}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:wait}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--ok-bg)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:700}
.muted{color:var(--muted);font-size:12px}
.notice{background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--text);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.ok{background:var(--ok-bg);border:1px solid var(--ok-border);color:var(--text);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.err{background:var(--bad-bg);border:1px solid var(--bad-border);color:var(--text);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px;white-space:pre-wrap}
.chars{display:flex;flex-wrap:wrap;gap:8px}
.char{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--raised);border:1px solid var(--line);cursor:pointer;user-select:none}
.char.on{border-color:var(--accent);background:var(--accent-soft)}
.char small{color:var(--muted)}
.anim{display:grid;grid-template-columns:1fr auto;gap:10px 16px;padding:14px 0;border-top:1px solid var(--line)}
.anim:first-of-type{border-top:0}
.anim.off{opacity:.55}
.title{background:transparent;border:1px solid transparent;color:var(--text);font-size:15px;font-weight:700;padding:3px 6px;border-radius:8px;margin-left:-6px;width:min(420px,100%)}
.title:hover,.title:focus{border-color:var(--line);outline:none;background:var(--raised)}
.meta{color:var(--muted);font-size:12px;margin-top:2px}
.meta code{background:var(--accent-soft);padding:1px 6px;border-radius:6px;color:var(--accent-text);font-size:11px;cursor:copy}
.opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.opt{display:flex;align-items:center;gap:8px}
.chip{border:1px solid var(--line2);background:var(--raised);color:var(--muted);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12px;font-weight:600}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.switch{position:relative;width:36px;height:20px;border-radius:999px;background:var(--toggle-off);cursor:pointer;flex:none;transition:.15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--knob);transition:.15s}
.switch.on{background:var(--color-toggle-on,var(--accent))}
.switch.on::after{left:19px;background:#fff}
input[type=range]{accent-color:var(--accent);width:120px}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.modal-bg{position:fixed;inset:0;background:var(--backdrop);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--color-surface-raised,#161a24);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(520px,92vw);max-height:86vh;overflow:auto}
.modal h3{margin:0 0 12px}
.modal label{display:flex;align-items:center;gap:8px;margin:7px 0}
.text{background:var(--field);border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:9px 11px;width:100%}
details summary{cursor:pointer;font-weight:700}
details p,details li{color:var(--muted);line-height:1.55}
a{color:var(--color-link,var(--accent-text))}
.toast{position:fixed;right:20px;bottom:20px;background:var(--color-surface-raised,#1b2130);color:var(--text);border:1px solid var(--line);padding:11px 14px;border-radius:12px;max-width:380px;z-index:60}
</style>
</head>
<body>
<div class="wrap" id="root">…</div>
<div id="toast" class="toast" style="display:none"></div>
<script src="app.js"></script>
</body>
</html>
