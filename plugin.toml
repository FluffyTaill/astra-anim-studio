[plugin]
id = "anim-studio"
name = "Anim Studio"
version = "1.0.4"
description = "Add your own avatar animations (VRMA, Mixamo FBX, GLB) and choose when she plays them: when bored, to music, or on a trigger."
author = "Taill"
license = "MIT"
icon = "icon.svg"
call_timeout_secs = 600

[entry]
command = "node"
args = ["dist/index.js"]
runtimes = ["node"]

[capabilities]
tools = true
ui_contributions = true

[platform]
os = ["windows"]
arch = []

[config]
schema = """
{"type":"object","properties":{}}
"""

[bundle]
schema = "astra.bundle/2"
target = "noarch"
