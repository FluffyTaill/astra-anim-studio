[plugin]
id = "anim-studio"
name = "Anim Studio"
version = "1.1.2"
description = "Add your own avatar animations (VRMA, Mixamo FBX, GLB) and choose when she plays them: when bored, to music, by time of day, or on a trigger."
author = "Taill"
license = "MIT"
icon = "icon.svg"
call_timeout_secs = 600

[entry]
command = "node"
args = ["dist/index.js"]
runtimes = ["node"]

[capabilities]
tools = true
triggers = true
ui_contributions = true

[platform]
os = ["windows"]
arch = []

[config]
schema = """
{"type":"object","properties":{}}
"""

[bundle]
schema = "astra.bundle/2"
target = "noarch"

[permissions]
fire_trigger = { reason = "Plays the avatar's morning stretch, wave and yawn and says her phrases through the two Astra commands the plugin page creates." }
